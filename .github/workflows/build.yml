name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file EXE
        run: dotnet publish src/ExchangeCertManager/ExchangeCertManager.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: ExchangeCertManager
          path: publish/ExchangeCertManager.exe
          if-no-files-found: error

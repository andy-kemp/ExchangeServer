name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # Code signing with Azure Artifact Signing (formerly Trusted Signing) turns on when its secrets are set:
      # AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (an app registration with the
      # "Artifact Signing Certificate Profile Signer" role), ARTIFACT_SIGNING_ENDPOINT (e.g. https://weu.codesigning.azure.net/),
      # ARTIFACT_SIGNING_ACCOUNT and ARTIFACT_SIGNING_PROFILE. Without them, builds are unsigned.
      SIGNING: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file EXE
        run: dotnet publish src/ExchangeCertManager/ExchangeCertManager.csproj -c Release -o publish

      - name: Capture screenshots (demo data)
        shell: pwsh
        timeout-minutes: 5
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Warning "Couldn't change resolution: $_" }
          $p = Start-Process -FilePath publish/ExchangeCertManager.exe -ArgumentList '--screenshots', "$PWD\screenshots" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Warning 'Screenshot run timed out' }
          Get-ChildItem screenshots -ErrorAction SilentlyContinue
          Get-ChildItem C:\ExchangeCertManager\Logs -ErrorAction SilentlyContinue | Get-Content | Select-String 'ERROR|WARNING' | Select-Object -First 20
          # Images as base64 in the log so they can be retrieved without artifact storage access
          Get-ChildItem screenshots -Filter *.png -ErrorAction SilentlyContinue | ForEach-Object {
            "PNGB64 $($_.Name) $([Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName)))"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: warn

      - name: Sign the EXE
        if: env.SIGNING == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files-folder: publish
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build the MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $version = ([xml](Get-Content src/ExchangeCertManager/ExchangeCertManager.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          New-Item -ItemType Directory -Force installer/out | Out-Null
          wix build installer/Package.wxs -arch x64 -d Version=$version -d Publish=publish -d Src=src/ExchangeCertManager -o installer/out/ExchangeCertManager.msi
          Get-Item installer/out/ExchangeCertManager.msi | Select-Object Name, Length

      - name: Sign the MSI
        if: env.SIGNING == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files-folder: installer/out
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Signature check
        shell: pwsh
        run: |
          foreach ($f in 'publish/ExchangeCertManager.exe', 'installer/out/ExchangeCertManager.msi') {
            $sig = Get-AuthenticodeSignature $f
            "{0}: {1} {2}" -f (Split-Path $f -Leaf), $sig.Status, $sig.SignerCertificate.Subject
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ExchangeCertManager
          path: |
            publish/ExchangeCertManager.exe
            installer/out/ExchangeCertManager.msi
          if-no-files-found: error

  # Publishes main builds to downloads.andykemp.com (R2 bucket akc-download) when the version in the project
  # file is new: exchange-cert-manager/<version>/ and exchange-cert-manager/latest/. A version is never overwritten,
  # so bump <Version> in ExchangeCertManager.csproj to release. Needs CLOUDFLARE_API_TOKEN (R2 edit) and
  # CLOUDFLARE_ACCOUNT_ID repository secrets.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ExchangeCertManager
          path: out

      - name: Upload to downloads.andykemp.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::warning::Repository secret(s) not available to this run:$missing. Nothing was published."; exit 0
          fi
          version=$(grep -oP '(?<=<Version>)[^<]+' src/ExchangeCertManager/ExchangeCertManager.csproj)
          bucket=akc-download; base=exchange-cert-manager
          if npx --yes wrangler@4 r2 object get "$bucket/$base/$version/SHA256SUMS.txt" --remote --pipe > /dev/null 2>&1; then
            echo "Version $version is already published; bump <Version> to release a new one."; exit 0
          fi
          cd out
          # The artifact keeps its folders (publish/, installer/out/); flatten them
          find . -mindepth 2 \( -name '*.exe' -o -name '*.msi' \) -exec mv {} . \; ; ls -l
          sha256sum ExchangeCertManager.exe ExchangeCertManager.msi > SHA256SUMS.txt
          printf '{"version":"%s","file":"ExchangeCertManager.exe","sha256":"%s","installer":"ExchangeCertManager.msi","installerSha256":"%s","published":"%s"}\n' \
            "$version" "$(grep ' ExchangeCertManager.exe$' SHA256SUMS.txt | cut -d' ' -f1)" "$(grep ' ExchangeCertManager.msi$' SHA256SUMS.txt | cut -d' ' -f1)" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
          put() { npx --yes wrangler@4 r2 object put "$bucket/$1" --file "$2" --content-type "$3" --cache-control "$4" --remote; }
          long='public, max-age=31536000, immutable'; short='public, max-age=300'
          put "$base/$version/ExchangeCertManager.exe" ExchangeCertManager.exe application/vnd.microsoft.portable-executable "$long"
          put "$base/$version/version.json" version.json application/json "$long"
          put "$base/$version/ExchangeCertManager.msi" ExchangeCertManager.msi application/x-msi "$long"
          put "$base/latest/ExchangeCertManager.exe" ExchangeCertManager.exe application/vnd.microsoft.portable-executable "$short"
          put "$base/latest/version.json" version.json application/json "$short"
          put "$base/latest/ExchangeCertManager.msi" ExchangeCertManager.msi application/x-msi "$short"
          put "$base/latest/SHA256SUMS.txt" SHA256SUMS.txt text/plain "$short"
          # Written last: its presence is what marks the version as published, so a failed run can simply be re-run
          put "$base/$version/SHA256SUMS.txt" SHA256SUMS.txt text/plain "$long"
          echo "Published $version: https://downloads.andykemp.com/$base/latest/ExchangeCertManager.exe" >> "$GITHUB_STEP_SUMMARY"

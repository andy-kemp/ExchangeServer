# Code signing: Azure Artifact Signing (account akc-signing, profile akc-public, Andy Kemp Consulting Ltd).
# The job signs in to Azure with OIDC through the app registration akc-codesign-github, whose federated
# credential only trusts this repo's `release` environment, so no signing secret is stored anywhere.
# Repo variables (not secrets): AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
# Signatures are checked before anything is published: there are no unsigned releases.
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC sign-in to Azure for code signing

env:
  SIGN_ENDPOINT: https://weu.codesigning.azure.net
  SIGN_ACCOUNT: akc-signing
  SIGN_PROFILE: akc-public
  SIGN_TSA: http://timestamp.acs.microsoft.com
  SIGN_PUBLISHER: Andy Kemp Consulting Ltd

jobs:
  build:
    runs-on: windows-latest
    # Main builds are signed and published (see the publish job); pull requests build unsigned. Signing uses the
    # `release` environment, the only place the signing identity (OIDC, no stored secret) is trusted.
    environment: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'release' || 'build' }}
    env:
      SIGNING: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file EXE
        run: dotnet publish src/ExchangeCertManager/ExchangeCertManager.csproj -c Release -o publish

      - name: Capture screenshots (demo data)
        shell: pwsh
        timeout-minutes: 5
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Warning "Couldn't change resolution: $_" }
          $p = Start-Process -FilePath publish/ExchangeCertManager.exe -ArgumentList '--screenshots', "$PWD\screenshots" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Warning 'Screenshot run timed out' }
          Get-ChildItem screenshots -ErrorAction SilentlyContinue
          Get-ChildItem C:\ExchangeCertManager\Logs -ErrorAction SilentlyContinue | Get-Content | Select-String 'ERROR|WARNING' | Select-Object -First 20
          # Images as base64 in the log so they can be retrieved without artifact storage access
          Get-ChildItem screenshots -Filter *.png -ErrorAction SilentlyContinue | ForEach-Object {
            "PNGB64 $($_.Name) $([Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName)))"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: warn

      - name: Sign in to Azure (OIDC, for code signing)
        if: env.SIGNING == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Microsoft's SignTool with the Artifact Signing dlib, which signs in through the Azure CLI session above.
      # Certificates last 72 hours, so the RFC 3161 timestamp is what keeps signatures valid. Writes two helpers:
      #   & $env:AKC_SIGN -Description 'Name shown in UAC' -Path a.exe, b.dll   (sign)
      #   & $env:AKC_CHECK -Path a.exe, b.dll                                     (Valid, timestamped, our publisher)
      - name: Set up code signing
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool) { throw 'signtool.exe not found on the runner' }
          $dlibDir = Join-Path $env:RUNNER_TEMP 'artifact-signing'
          nuget install Microsoft.ArtifactSigning.Client -x -OutputDirectory $dlibDir -NonInteractive | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Microsoft.ArtifactSigning.Client' }
          $dlib = Get-ChildItem $dlibDir -Recurse -Filter Azure.CodeSigning.Dlib.dll | Where-Object FullName -match '\\x64\\' | Select-Object -First 1
          if (-not $dlib) { throw 'Azure.CodeSigning.Dlib.dll (x64) not found in the package' }
          $meta = Join-Path $env:RUNNER_TEMP 'artifact-signing.json'
          @{ Endpoint = $env:SIGN_ENDPOINT; CodeSigningAccountName = $env:SIGN_ACCOUNT; CertificateProfileName = $env:SIGN_PROFILE; CorrelationId = "${{ github.repository }}@${{ github.sha }}" } |
            ConvertTo-Json | Set-Content $meta -Encoding utf8NoBOM
          $sign = @'
          param([Parameter(Mandatory)][string]$Description, [Parameter(Mandatory)][string[]]$Path)
          foreach ($f in $Path) {
            & $env:SIGNTOOL sign /v /fd SHA256 /tr $env:SIGN_TSA /td SHA256 /d $Description /du 'https://www.andykemp.com' /dlib $env:SIGN_DLIB /dmdf $env:SIGN_META $f
            if ($LASTEXITCODE -ne 0) { throw "Could not sign $f" }
          }
          '@
          $check = @'
          param([Parameter(Mandatory)][string[]]$Path)
          $bad = @()
          foreach ($f in $Path) {
            $s = Get-AuthenticodeSignature $f
            Write-Host "$f : $($s.Status) | $($s.SignerCertificate.Subject) | timestamped: $([bool]$s.TimeStamperCertificate)"
            if ($s.Status -ne 'Valid') { $bad += "$f is $($s.Status)" }
            if (-not $s.TimeStamperCertificate) { $bad += "$f has no timestamp" }
            if ($s.SignerCertificate.Subject -notmatch "O=$([regex]::Escape($env:SIGN_PUBLISHER))") { $bad += "$f is signed by '$($s.SignerCertificate.Subject)'" }
          }
          if ($bad) { $bad | ForEach-Object { Write-Host "::error::$_" }; throw 'Signature check failed: nothing is released' }
          '@
          Set-Content (Join-Path $env:RUNNER_TEMP 'akc-sign.ps1') $sign
          Set-Content (Join-Path $env:RUNNER_TEMP 'akc-check.ps1') $check
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "SIGN_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV
          "SIGN_META=$meta" >> $env:GITHUB_ENV
          "AKC_SIGN=$(Join-Path $env:RUNNER_TEMP 'akc-sign.ps1')" >> $env:GITHUB_ENV
          "AKC_CHECK=$(Join-Path $env:RUNNER_TEMP 'akc-check.ps1')" >> $env:GITHUB_ENV
          Write-Host "SignTool $($signtool.Directory.Parent.Name), dlib $($dlib.FullName)"

      - name: Sign the EXE
        if: env.SIGNING == 'true'
        shell: pwsh
        run: '& $env:AKC_SIGN -Description "Exchange Certificate Manager" -Path publish/ExchangeCertManager.exe'

      - name: Build the MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $version = ([xml](Get-Content src/ExchangeCertManager/ExchangeCertManager.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          New-Item -ItemType Directory -Force installer/out | Out-Null
          wix build installer/Package.wxs -arch x64 -d Version=$version -d Publish=publish -d Src=src/ExchangeCertManager -o installer/out/ExchangeCertManager.msi
          Get-Item installer/out/ExchangeCertManager.msi | Select-Object Name, Length

      - name: Sign the MSI
        if: env.SIGNING == 'true'
        shell: pwsh
        run: '& $env:AKC_SIGN -Description "Exchange Certificate Manager" -Path installer/out/ExchangeCertManager.msi'

      # Main builds must be signed, timestamped and from Andy Kemp Consulting Ltd, or nothing is published
      - name: Signature check
        shell: pwsh
        run: |
          $files = 'publish/ExchangeCertManager.exe', 'installer/out/ExchangeCertManager.msi'
          if ($env:SIGNING -eq 'true') { & $env:AKC_CHECK -Path $files }
          else { foreach ($f in $files) { $sig = Get-AuthenticodeSignature $f; "{0}: {1} (pull request build, unsigned)" -f (Split-Path $f -Leaf), $sig.Status } }

      - uses: actions/upload-artifact@v4
        with:
          name: ExchangeCertManager
          path: |
            publish/ExchangeCertManager.exe
            installer/out/ExchangeCertManager.msi
          if-no-files-found: error

  # Publishes main builds to downloads.andykemp.com (R2 bucket akc-download) when the version in the project
  # file is new: exchange-cert-manager/<version>/ and exchange-cert-manager/latest/. A version is never overwritten,
  # so bump <Version> in ExchangeCertManager.csproj to release. Needs CLOUDFLARE_API_TOKEN (R2 edit) and
  # CLOUDFLARE_ACCOUNT_ID repository secrets.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ExchangeCertManager
          path: out

      - name: Upload to downloads.andykemp.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::warning::Repository secret(s) not available to this run:$missing. Nothing was published."; exit 0
          fi
          version=$(grep -oP '(?<=<Version>)[^<]+' src/ExchangeCertManager/ExchangeCertManager.csproj)
          bucket=akc-download; base=exchange-cert-manager
          if npx --yes wrangler@4 r2 object get "$bucket/$base/$version/SHA256SUMS.txt" --remote --pipe > /dev/null 2>&1; then
            echo "Version $version is already published; bump <Version> to release a new one."; exit 0
          fi
          cd out
          # The artifact keeps its folders (publish/, installer/out/); flatten them
          find . -mindepth 2 \( -name '*.exe' -o -name '*.msi' \) -exec mv {} . \; ; ls -l
          sha256sum ExchangeCertManager.exe ExchangeCertManager.msi > SHA256SUMS.txt
          printf '{"version":"%s","file":"ExchangeCertManager.exe","sha256":"%s","installer":"ExchangeCertManager.msi","installerSha256":"%s","published":"%s"}\n' \
            "$version" "$(grep ' ExchangeCertManager.exe$' SHA256SUMS.txt | cut -d' ' -f1)" "$(grep ' ExchangeCertManager.msi$' SHA256SUMS.txt | cut -d' ' -f1)" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
          put() { npx --yes wrangler@4 r2 object put "$bucket/$1" --file "$2" --content-type "$3" --cache-control "$4" --remote; }
          long='public, max-age=31536000, immutable'; short='public, max-age=300'
          put "$base/$version/ExchangeCertManager.exe" ExchangeCertManager.exe application/vnd.microsoft.portable-executable "$long"
          put "$base/$version/version.json" version.json application/json "$long"
          put "$base/$version/ExchangeCertManager.msi" ExchangeCertManager.msi application/x-msi "$long"
          put "$base/latest/ExchangeCertManager.exe" ExchangeCertManager.exe application/vnd.microsoft.portable-executable "$short"
          put "$base/latest/version.json" version.json application/json "$short"
          put "$base/latest/ExchangeCertManager.msi" ExchangeCertManager.msi application/x-msi "$short"
          put "$base/latest/SHA256SUMS.txt" SHA256SUMS.txt text/plain "$short"
          # Written last: its presence is what marks the version as published, so a failed run can simply be re-run
          put "$base/$version/SHA256SUMS.txt" SHA256SUMS.txt text/plain "$long"
          echo "Published $version: https://downloads.andykemp.com/$base/latest/ExchangeCertManager.exe" >> "$GITHUB_STEP_SUMMARY"
